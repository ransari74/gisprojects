<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ============ tokens: light is the base, both themes defined at token level ============ */
:root{
  --ground:#EDEFF3;
  --paper:#FAFBFC;
  --paper-2:#F2F4F7;
  --sunk:#E4E8EE;
  --ink:#101720;
  --ink-2:#3B4654;
  --ink-3:#6B7787;
  --rule:#D3D9E2;
  --rule-soft:#E2E7EE;
  --teal:#12707A;
  --teal-bright:#0E8A96;
  --teal-wash:#DDEEF0;
  --ochre:#A96C15;
  --ochre-wash:#F5EAD6;
  --violet:#5C41A8;
  --violet-wash:#E9E4F6;
  --good:#2A6B43;
  --warn:#A05A12;
  --crit:#9B2C2C;
  --code-bg:#151C25;
  --code-ink:#DCE3EC;
  --code-dim:#7D8BA0;
  --code-key:#7FC7C2;
  --code-str:#D9A75F;
  --code-num:#B0A2E8;
  --shadow:0 1px 2px rgba(16,23,32,.06), 0 8px 24px -12px rgba(16,23,32,.18);
  --grid-line:rgba(16,23,32,.045);

  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;

  --rail:288px;
  --measure:68ch;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1216;
    --paper:#151B21;
    --paper-2:#1B222A;
    --sunk:#111820;
    --ink:#E6EBF1;
    --ink-2:#AEB9C6;
    --ink-3:#7C8895;
    --rule:#2A333D;
    --rule-soft:#222A33;
    --teal:#4FBAC2;
    --teal-bright:#6FD2D8;
    --teal-wash:#123037;
    --ochre:#DBA254;
    --ochre-wash:#33270F;
    --violet:#A28DE8;
    --violet-wash:#231C3C;
    --good:#68C08A;
    --warn:#DBA254;
    --crit:#E28787;
    --code-bg:#0B1015;
    --code-ink:#D6DEE8;
    --code-dim:#6C7A8C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    --grid-line:rgba(230,235,241,.04);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1216;
  --paper:#151B21;
  --paper-2:#1B222A;
  --sunk:#111820;
  --ink:#E6EBF1;
  --ink-2:#AEB9C6;
  --ink-3:#7C8895;
  --rule:#2A333D;
  --rule-soft:#222A33;
  --teal:#4FBAC2;
  --teal-bright:#6FD2D8;
  --teal-wash:#123037;
  --ochre:#DBA254;
  --ochre-wash:#33270F;
  --violet:#A28DE8;
  --violet-wash:#231C3C;
  --good:#68C08A;
  --warn:#DBA254;
  --crit:#E28787;
  --code-bg:#0B1015;
  --code-ink:#D6DEE8;
  --code-dim:#6C7A8C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --grid-line:rgba(230,235,241,.04);
}

*{box-sizing:border-box}
body{
  margin:0;
  background-color:var(--ground);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:17px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
@media (max-width:900px){ body{font-size:16px} }

h1,h2,h3,h4,.dsp{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;letter-spacing:-.015em;margin:0}
code,kbd,pre,.mono{font-family:var(--f-mono)}
a{color:var(--teal);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--teal-bright)}
:focus-visible{outline:2px solid var(--teal-bright);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;scroll-behavior:auto !important}}
html{scroll-behavior:smooth}

/* ============ shell ============ */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:0;align-items:start;max-width:1500px;margin:0 auto}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 20px 60px 26px;border-right:1px solid var(--rule);background:var(--ground);background:color-mix(in srgb, var(--ground) 82%, var(--paper));backdrop-filter:blur(6px)}
.main{min-width:0;padding:0 clamp(20px,4vw,64px) 140px}
@media (max-width:1040px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule);padding:20px}
  .rail-scroll{max-height:none}
}

.brandmark{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
.brandmark .n{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);border:1px solid var(--teal);padding:2px 6px;border-radius:3px}
.brandmark .t{font-family:var(--f-display);font-size:19px;font-weight:600}
.rail p.sub{font-size:13px;color:var(--ink-3);margin:6px 0 18px;line-height:1.45}

nav.toc{display:flex;flex-direction:column;gap:2px}
nav.toc .grp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
nav.toc .grp::after{content:"";flex:1;height:1px;background:var(--rule)}
nav.toc a{display:flex;gap:9px;align-items:baseline;font-family:var(--f-display);font-size:14px;color:var(--ink-2);text-decoration:none;padding:5px 8px;border-radius:5px;border-left:2px solid transparent;transition:background .15s,color .15s}
nav.toc a .num{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);min-width:22px;font-variant-numeric:tabular-nums}
nav.toc a:hover{background:var(--paper-2);color:var(--ink)}
nav.toc a.on{background:var(--teal-wash);color:var(--teal);border-left-color:var(--teal);font-weight:600}
nav.toc a.on .num{color:var(--teal)}

.railbtns{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.btn{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);border:1px solid var(--rule);color:var(--ink-2);padding:7px 11px;border-radius:5px;cursor:pointer;transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--teal);color:var(--teal)}

/* ============ hero ============ */
.hero{padding:clamp(48px,8vh,96px) 0 40px;border-bottom:1px solid var(--rule);max-width:var(--measure)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--teal)}
.hero h1{font-size:clamp(38px,6.4vw,68px);margin:18px 0 0;letter-spacing:-.035em;font-weight:700}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero .lede{font-size:clamp(18px,2.1vw,21px);color:var(--ink-2);margin:22px 0 0;max-width:60ch}
.statrow{display:flex;flex-wrap:wrap;gap:0;margin:38px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.statrow div{flex:1 1 130px;padding:16px 18px 16px 0;border-right:1px solid var(--rule-soft)}
.statrow div:last-child{border-right:none}
.statrow .k{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-.02em}
.statrow .l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}

/* ============ sections ============ */
section{padding:64px 0 8px;scroll-margin-top:20px}
.sec-head{max-width:var(--measure);margin-bottom:26px}
.sec-head h2{font-size:clamp(27px,3.4vw,38px);margin-top:12px;letter-spacing:-.028em}
.sec-head p{color:var(--ink-2);margin:12px 0 0}
h3{font-size:22px;margin:38px 0 10px;max-width:var(--measure)}
h4{font-size:16.5px;margin:26px 0 8px;font-weight:600;max-width:var(--measure)}
p,ul,ol{max-width:var(--measure)}
p{margin:0 0 14px}
ul,ol{padding-left:22px;margin:0 0 16px}
li{margin:0 0 7px}
li::marker{color:var(--ink-3)}
strong{font-weight:600;color:var(--ink)}
em.term{font-style:normal;font-family:var(--f-mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:3px;color:var(--ink)}
hr.rule{border:none;border-top:1px solid var(--rule);margin:44px 0;max-width:var(--measure)}

/* ============ components ============ */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:20px 22px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.wide{max-width:1080px}

.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-3);background:var(--paper)}
.tag.t-ml{color:var(--violet);border-color:var(--violet);background:var(--violet-wash)}
.tag.t-sd{color:var(--teal);border-color:var(--teal);background:var(--teal-wash)}
.tag.t-dsa{color:var(--ochre);border-color:var(--ochre);background:var(--ochre-wash)}
.tag.t-beh{color:var(--ink-2);border-color:var(--rule);background:var(--paper-2)}

.callout{border-left:3px solid var(--teal);background:var(--paper);padding:16px 20px;border-radius:0 7px 7px 0;margin:20px 0;max-width:var(--measure)}
.callout .ct{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}
.callout.warnbox{border-left-color:var(--warn)}
.callout.warnbox .ct{color:var(--warn)}
.callout.mlbox{border-left-color:var(--violet)}
.callout.mlbox .ct{color:var(--violet)}

pre{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:18px 20px;overflow-x:auto;font-size:13.2px;line-height:1.62;border:1px solid var(--rule);margin:16px 0;max-width:1080px}
pre code{color:inherit;background:none;padding:0;font-size:inherit}
code{background:var(--sunk);padding:1.5px 5px;border-radius:3px;font-size:.87em}
.cm{color:var(--code-dim);font-style:italic}
.kw{color:var(--code-key)}
.st{color:var(--code-str)}
.nu{color:var(--code-num)}
.codehead{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--code-bg);border:1px solid var(--rule);border-bottom:none;border-radius:8px 8px 0 0;padding:9px 16px;margin:18px 0 -16px;max-width:1080px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--code-dim)}
.codehead + pre{border-radius:0 0 8px 8px;margin-top:0}
.copy{background:none;border:1px solid var(--code-dim);color:var(--code-dim);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;cursor:pointer}
.copy:hover{color:var(--code-ink);border-color:var(--code-ink)}

.tbl-wrap{overflow-x:auto;margin:18px 0;max-width:1080px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule);background:var(--paper-2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td code{font-size:12.5px}

/* box-and-arrow diagram */
.diagram{overflow-x:auto;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:22px;margin:20px 0;max-width:1080px}
.dflow{display:flex;align-items:stretch;gap:0;min-width:min-content}
.dcol{display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:132px}
.node{border:1px solid var(--rule);background:var(--paper-2);border-radius:6px;padding:9px 12px;font-family:var(--f-mono);font-size:11.5px;line-height:1.35;text-align:center;color:var(--ink)}
.node small{display:block;color:var(--ink-3);font-size:10px;margin-top:3px}
.node.pri{border-color:var(--teal);background:var(--teal-wash);color:var(--teal)}
.node.ml{border-color:var(--violet);background:var(--violet-wash);color:var(--violet)}
.node.store{border-style:dashed}
.arrow{display:flex;align-items:center;justify-content:center;min-width:44px;color:var(--ink-3);font-family:var(--f-mono);font-size:12px;position:relative}
.arrow span{position:absolute;top:calc(50% - 22px);font-size:9.5px;letter-spacing:.06em;white-space:nowrap;color:var(--ink-3)}
.dcap{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-top:14px;text-align:center}

/* checklist */
.check{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule-soft)}
.check:last-child{border-bottom:none}
.check input{appearance:none;width:17px;height:17px;min-width:17px;margin-top:4px;border:1.5px solid var(--rule);border-radius:4px;cursor:pointer;background:var(--paper);position:relative}
.check input:checked{background:var(--teal);border-color:var(--teal)}
.check input:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--paper);font-size:12px;font-weight:700}
.check label{cursor:pointer;font-size:15px;line-height:1.5}
.check input:checked + label{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule)}

/* day grid */
.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:20px 0;max-width:1080px}
@media (max-width:760px){.daygrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.day{background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:9px 10px 11px;min-height:104px;display:flex;flex-direction:column;gap:5px}
.day .d{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.day .w{font-family:var(--f-display);font-size:12.5px;font-weight:600;line-height:1.25}
.day .m{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3);line-height:1.4;margin-top:auto}
.day.k-sd{border-top:3px solid var(--teal)}
.day.k-ml{border-top:3px solid var(--violet)}
.day.k-dsa{border-top:3px solid var(--ochre)}
.day.k-mix{border-top:3px solid var(--ink-3)}
.day.rest{background:var(--sunk);border-style:dashed}

/* q&a */
details.qa{border:1px solid var(--rule);border-radius:7px;background:var(--paper);margin:9px 0;max-width:1080px;overflow:hidden}
details.qa summary{cursor:pointer;padding:13px 18px;font-family:var(--f-display);font-weight:500;font-size:15.5px;list-style:none;display:flex;gap:12px;align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:"+";font-family:var(--f-mono);color:var(--teal);font-size:15px;line-height:1.35}
details.qa[open] summary::before{content:"−"}
details.qa[open] summary{border-bottom:1px solid var(--rule-soft)}
details.qa .body{padding:14px 18px 4px 42px}
details.qa .body p,details.qa .body ul{max-width:64ch}

.kbar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin:14px 0}
.legend i{display:inline-block;width:22px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.footer{border-top:1px solid var(--rule);margin-top:70px;padding:28px 0 0;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);max-width:var(--measure)}
.progressbar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:10px}
.progressbar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.railprog{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin-top:16px;letter-spacing:.06em}

/* ---- added: numbered timeline, definition grid, part dividers ---- */
.stepline{list-style:none;counter-reset:sl;padding:0;margin:22px 0;max-width:1080px;border-left:1px solid var(--rule)}
.stepline li{counter-increment:sl;position:relative;padding:0 0 22px 34px;margin:0}
.stepline li::before{content:counter(sl);position:absolute;left:-13px;top:1px;width:25px;height:25px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);color:var(--ink-3);font-family:var(--f-mono);font-size:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.stepline li.hot::before{background:var(--teal-wash);border-color:var(--teal);color:var(--teal)}
.stepline li b{font-family:var(--f-display);font-size:16px;display:block;margin-bottom:4px}
.stepline li p{margin:0 0 8px;max-width:66ch}
.stepline li:last-child{padding-bottom:0}

.deflist{display:grid;grid-template-columns:minmax(140px,190px) 1fr;gap:0;max-width:1080px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:20px 0;background:var(--paper)}
.deflist dt{font-family:var(--f-mono);font-size:12px;padding:12px 14px;border-bottom:1px solid var(--rule-soft);background:var(--paper-2);color:var(--ink);display:flex;align-items:flex-start}
.deflist dd{margin:0;padding:12px 16px;border-bottom:1px solid var(--rule-soft);font-size:14.8px;line-height:1.55}
.deflist dt:last-of-type,.deflist dd:last-of-type{border-bottom:none}
@media (max-width:640px){.deflist{grid-template-columns:1fr}.deflist dt{border-bottom:none;padding-bottom:2px;background:none}}

.partbreak{max-width:1080px;margin:86px 0 0;padding:26px 0 0;border-top:2px solid var(--ink)}
.partbreak .pn{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
.partbreak h2{font-size:clamp(30px,4.6vw,46px);margin:10px 0 0;letter-spacing:-.03em}
.partbreak p{color:var(--ink-2);margin:12px 0 0;max-width:62ch;font-size:18px}
nav.toc .part{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:22px 0 2px;padding-top:12px;border-top:1px solid var(--rule)}
nav.toc .part:first-of-type{margin-top:14px}

.lc{display:grid;grid-template-columns:52px 1fr auto;gap:0 12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule-soft);font-size:14.5px}
.lc:last-child{border-bottom:none}
.lc .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.lc .df{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-3);white-space:nowrap}
.lc .df.e{color:var(--good);border-color:var(--good)}
.lc .df.m{color:var(--warn);border-color:var(--warn)}
.lc .df.h{color:var(--crit);border-color:var(--crit)}
.lc .st{font-weight:600}

/* ---- book series layout ---- */
.bookhead{max-width:var(--measure);padding:clamp(44px,7vh,80px) 0 34px;border-bottom:1px solid var(--rule)}
.serieskicker{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--teal)}
.serieskicker .of{color:var(--ink-3)}
.bookhead h1{font-size:clamp(36px,6vw,62px);margin:20px 0 0;letter-spacing:-.035em;font-weight:700}
.bookhead .lede{font-size:clamp(17.5px,2vw,20.5px);color:var(--ink-2);margin:20px 0 0;max-width:62ch}
.readmeta{display:flex;gap:22px;flex-wrap:wrap;margin-top:26px;font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

.chapnum{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chapnum::before{content:"";width:20px;height:1px;background:var(--teal)}

.booknav{display:flex;gap:14px;flex-wrap:wrap;margin:64px 0 0;padding-top:26px;border-top:2px solid var(--ink);max-width:1080px}
.booknav a{flex:1 1 260px;text-decoration:none;border:1px solid var(--rule);border-radius:8px;padding:16px 18px;background:var(--paper);transition:border-color .15s}
.booknav a:hover{border-color:var(--teal)}
.booknav .dir{font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.booknav .nm{font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--ink);margin-top:6px;display:block}
.booknav .ds{font-size:14px;color:var(--ink-2);margin-top:5px;display:block;line-height:1.45}

.translate{display:grid;grid-template-columns:1fr auto 1fr;gap:0;max-width:1080px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:22px 0;background:var(--paper)}
.translate .th{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:10px 16px;background:var(--paper-2);border-bottom:1px solid var(--rule)}
.translate .th.mid{background:var(--paper-2);border-bottom:1px solid var(--rule)}
.translate .a,.translate .b{padding:13px 16px;border-bottom:1px solid var(--rule-soft);font-size:14.8px;line-height:1.5}
.translate .a{background:color-mix(in srgb, var(--ochre-wash) 45%, var(--paper))}
.translate .m{display:flex;align-items:center;justify-content:center;padding:0 12px;color:var(--teal);font-family:var(--f-mono);font-size:13px;border-bottom:1px solid var(--rule-soft)}
.translate .a:last-of-type,.translate .b:last-of-type,.translate .m:last-of-type{border-bottom:none}
@media (max-width:720px){.translate{grid-template-columns:1fr}.translate .m{padding:4px 0;justify-content:flex-start;padding-left:16px}.translate .th.mid{display:none}}

.stage{border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:20px 22px;margin:22px 0;max-width:1080px}
.stage .sh{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.stage .sn{font-family:var(--f-mono);font-size:11px;color:var(--paper);background:var(--teal);border-radius:4px;padding:3px 8px;letter-spacing:.08em}
.stage .st{font-family:var(--f-display);font-size:19px;font-weight:600}
.stage .why{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:14px;padding-top:12px;border-top:1px solid var(--rule-soft)}
</style>
