data:
  source_url: "https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv"
  target_column: Churn
  id_column: customerID
  split:
    train: 0.70
    val: 0.15
    test: 0.15
    seed: 42
  synthetic_fallback:
    n_samples: 7043
    seed: 42

baseline:
  max_iter: 1000
  C: 1.0

xgboost:
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  tuning:
    max_depth: [3, 10]
    learning_rate: [0.01, 0.3]
    n_estimators: [100, 500]
    max_jobs: 20
    max_parallel_jobs: 4
    objective_metric: validation:auc

lightgbm:
  n_estimators: 300
  num_leaves: 31
  learning_rate: 0.05

nn:
  hidden_dims: [64, 32]
  epochs: 30
  batch_size: 64
  lr: 0.001
  dropout: 0.2
