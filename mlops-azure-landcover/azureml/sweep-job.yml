$schema: https://azuremlschemas.azureedge.net/latest/sweepJob.schema.json
type: sweep
trial:
  command: >-
    python -m src.data.download_eurosat --data-dir ${{outputs.data_dir}} &&
    python -m src.models.finetune --data-dir ${{outputs.data_dir}} --arch resnet18
    --epochs 8 --batch-size 64 --lr ${{search_space.lr}} --weight-decay ${{search_space.weight_decay}}
  code: ../
  environment:
    conda_file: environment.yml
    image: mcr.microsoft.com/azureml/curated/acpt-pytorch-2.2-cuda12.1:latest
  outputs:
    data_dir:
      type: uri_folder
compute: azureml:gpu-cluster
sampling_algorithm: bayesian
search_space:
  lr:
    type: loguniform
    min_value: -11.5   # ln(1e-5)
    max_value: -4.6     # ln(1e-2)
  weight_decay:
    type: loguniform
    min_value: -13.8    # ln(1e-6)
    max_value: -6.9      # ln(1e-3)
objective:
  goal: maximize
  primary_metric: val_f1_macro
limits:
  max_total_trials: 12
  max_concurrent_trials: 4
  timeout: 14400
experiment_name: eurosat-landcover
display_name: sweep-resnet18-lr-wd
